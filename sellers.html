<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>김치 사는 곳 | 김치로</title><link rel="stylesheet" href="sellers.css"></head><body>
<header><a href="/">🥬 김치로</a><nav><a href="/">먹는 곳</a><a href="/sellers.html" aria-current="page">사는 곳</a></nav></header>
<main><section><p class="eyebrow">KIMCHIRO MARKET</p><h1>우리 김치,<br>어디서 살까요?</h1><p>제품별 원산지를 확인한 김치 판매처를 모아요.</p><p class="muted">제품과 원재료는 바뀔 수 있어요. 구매 전 판매처의 최신 표시를 확인해 주세요.</p></section>
<section><div class="head"><h2>김치 사는 곳</h2><label>판매 방식 <select id="filter"><option>전체</option><option>온라인</option><option>매장</option></select></label></div><div id="products" aria-live="polite">불러오는 중이에요.</div></section>
<section class="admin"><h2>업체 조사 관리</h2><p>운영자만 볼 수 있는 업체 연락·조사 기록이에요.</p><div id="adminStatus" role="status">운영자 권한 확인 중…</div><a id="loginLink" href="/#admin" hidden>운영자 로그인하기 ↗</a><div id="adminContent" hidden><div id="partners"></div><h3>업체 추가</h3><form id="partnerForm"><label>업체명<input name="name" required maxlength="120"></label><label>연락처<input name="phone" maxlength="100"></label><label>근거 링크<input name="source" type="url" maxlength="1000"></label><label>조사 메모<textarea name="memo" maxlength="4000"></textarea></label><button>업체 저장</button></form><h3>확인한 상품 공개</h3><p>제품 표시에서 배추와 고춧가루가 모두 국내산인지 직접 확인한 뒤 등록해 주세요. 매장은 방문 구매 가능한 주소를 적어주세요.</p><form id="productForm"><label>업체명<input name="name" required maxlength="120"></label><label>확인한 제품명<input name="product" required maxlength="200"></label><label>판매 방식<select name="kind"><option>온라인</option><option>매장</option></select></label><label>매장 주소<input name="address" maxlength="300"></label><label>구매 또는 매장 안내 링크<input name="link" type="url" required maxlength="1000" placeholder="https://"></label><label>제품별 원산지 근거 링크<input name="source" type="url" required maxlength="1000" placeholder="https://"></label><label>확인일<input name="verified_on" type="date" required></label><button>확인하고 공개하기</button></form></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="sellers.js"></script></body></html>
